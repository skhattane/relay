<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="relay — rooms, seats, and messages that pass from one session to the next">
  <title>relay — rooms, seats, and messages that pass from one session to the next</title>
  <defs>
    <linearGradient id="relay-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="relay-fade" gradientUnits="userSpaceOnUse" x1="700" y1="160" x2="1202" y2="160">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#relay-ground)"/>
  <rect x="1.5" y="1.5" width="1277" height="317" rx="22.5" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- three rooms in a row; one line runs through them without a break -->
  <g fill="none" stroke="#334155" stroke-width="6">
    <circle cx="820" cy="160" r="62"/>
    <circle cx="980" cy="160" r="62"/>
    <circle cx="1140" cy="160" r="62"/>
  </g>
  <path d="M 700 160 H 1202" fill="none" stroke="url(#relay-fade)" stroke-width="6" stroke-linecap="round"/>
  <!-- seats, where the line crosses each room -->
  <g fill="#0f172a" stroke="#94a3b8" stroke-width="5">
    <circle cx="758" cy="160" r="13"/>
    <circle cx="900" cy="160" r="13"/>
    <circle cx="1060" cy="160" r="13"/>
  </g>
  <circle cx="1202" cy="160" r="13" fill="#0f172a" stroke="#f8fafc" stroke-width="5"/>
  <!-- the message, between two seats -->
  <circle cx="980" cy="160" r="10" fill="#f59e0b"/>

  <!-- the mark -->
  <g transform="translate(72 88) scale(0.28125)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#475569" stroke-width="18"/>
    <path d="M 256 106 A 150 150 0 0 1 385.9 331" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
    <circle cx="126.1" cy="331" r="34" fill="#0f172a" stroke="#94a3b8" stroke-width="14"/>
    <circle cx="256" cy="106" r="34" fill="#f8fafc"/>
    <circle cx="385.9" cy="331" r="34" fill="#0f172a" stroke="#f8fafc" stroke-width="14"/>
    <circle cx="385.9" cy="181" r="22" fill="#f59e0b"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="240" y="158" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">relay</text>
    <text x="243" y="204" font-size="24" fill="#cbd5e1">Rooms, seats, and messages that pass</text>
    <text x="243" y="236" font-size="24" fill="#cbd5e1">from one session to the next.</text>
  </g>
</svg>
